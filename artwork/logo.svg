  <g stroke="#16110D" stroke-width="5" stroke-linejoin="round">
    <!-- orejas -->
    <path fill="#F3E6D3" d="M88 74 L66 12 L118 50 Z"/>
    <path fill="#F3E6D3" d="M168 74 L190 12 L138 50 Z"/>
    <!-- cabeza ovalada -->
    <path fill="#F3E6D3" d="M128 34 C174 34 190 82 186 130 C182 192 160 238 128 238 C96 238 74 192 70 130 C66 82 82 34 128 34 Z"/>
  </g>
  <!-- interior de las orejas -->
  <path fill="#E0762B" d="M88 64 L73 24 L109 52 Z"/>
  <path fill="#E0762B" d="M168 64 L183 24 L147 52 Z"/>
