  <!-- ojos triangulares -->
  <path fill="#16110D" d="M90 101 L119 110 L100 121 Z"/>
  <path fill="#16110D" d="M166 101 L137 110 L156 121 Z"/>
  <!-- nariz y boca -->
  <path fill="#16110D" d="M110 202 Q128 192 146 202 Q148 216 128 221 Q108 216 110 202 Z"/>
  <path fill="none" stroke="#16110D" stroke-width="4" stroke-linecap="round" d="M128 221 L128 229 M116 231 Q128 236 140 231"/>
