# Ajustes de rendimiento de BullOS (gaming y desarrollo)

# Memoria: con zram conviene intercambiar antes a RAM comprimida
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Juegos: muchos títulos (Proton, DayZ, Hogwarts Legacy...) necesitan más mapeos
vm.max_map_count = 2147483642
# Evita tirones en juegos que usan split locks
kernel.split_lock_mitigate = 0

# Desarrollo: IDEs y herramientas que vigilan muchos archivos
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# Red: menor latencia y mejor rendimiento
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
